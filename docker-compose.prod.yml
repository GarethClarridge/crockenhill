# Production Docker Compose - standalone file for the server
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Set IMAGE_TAG to the smoke-tested Git SHA before deploying
# Example: IMAGE_TAG=<git-sha> docker compose -f docker-compose.prod.yml --env-file .env.production up -d

services:
  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks:
      - crockenhill

  app:
    # Runs nginx, php-fpm, Redis queue workers, and Laravel's scheduler via Supervisor.
    image: ghcr.io/garethclarridge/crockenhill:${IMAGE_TAG:?IMAGE_TAG must be set to the smoke-tested Git SHA}
    restart: always
    expose:
      - "80"
    env_file:
      - .env.production
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Persist local storage (pages, temporary files - sermons are in Spaces)
      - app-storage:/var/www/html/storage/app/public
      # Temp storage for large file uploads (Livewire uploads + processing)
      - app-temp:/var/www/html/storage/app/temp
      - app-livewire-tmp:/var/www/html/storage/app/livewire-tmp
      # Children's-talk assets and section-publication preview clips. INTERIM:
      # superseded by the do_spaces_private disk once WP6 of
      # docs/plans/CHILDRENS-TALK-STORAGE-TO-SPACES-2026-07-24.md lands. Without
      # this mount the directory lives in the container's writable layer and is
      # destroyed on every deploy. Do not remove it as "unused" — see that plan.
      - app-private:/var/www/html/storage/app/private
      # Persist logs for debugging (also captured by Docker logging below)
      - app-logs:/var/www/html/storage/logs
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - crockenhill

  mysql:
    image: mysql:8.0
    restart: always
    env_file:
      - .env.production
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Use TCP check without passing the password on the command line.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h 127.0.0.1 -u root --silent 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - crockenhill

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - crockenhill

networks:
  crockenhill:
    driver: bridge

volumes:
  caddy-data:      # Let's Encrypt certificates
  caddy-config:    # Caddy configuration cache
  app-storage:     # Laravel storage (non-Spaces files)
  app-temp:        # Temp storage for large file uploads and processing
  app-livewire-tmp: # Livewire temporary file uploads
  app-private:     # Children's-talk + section-publication assets (interim, see CHILDRENS-TALK-STORAGE-TO-SPACES plan)
  app-logs:        # Laravel logs (persisted across container restarts)
  mysql-data:      # Database persistence
  redis-data:      # Queue/cache persistence
