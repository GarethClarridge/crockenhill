name: Deep Checks

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Which deep-check suite should run?
        required: true
        default: all
        type: choice
        options:
          - all
          - full-tests
          - dedicated
          - dusk
          - playwright
          - lighthouse
          - dependency-audit
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Requested Deep Checks
    runs-on: ubuntu-latest
    outputs:
      frontend_changed: ${{ steps.detect.outputs.frontend_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: detect
        name: Detect frontend-impacting changes
        shell: bash
        run: |
          set -euo pipefail

          frontend_changed=false

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            changed_files="$(git diff --name-only "$base_sha...$head_sha")"

            if grep -Eq '^(app/Http/Controllers/|app/Livewire/|resources/|routes/web.php|public/|tests/Browser/|tests/Playwright/|database/seeders/|database/factories/|playwright\.config\.ts|lighthouserc\.json|package(-lock)?\.json|vite\.config\.mjs)' <<<"$changed_files"; then
              frontend_changed=true
            fi
          fi

          echo "frontend_changed=$frontend_changed" >> "$GITHUB_OUTPUT"

  full-tests:
    name: Full PHPUnit Suite
    needs: changes
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'full-tests')) || contains(github.event.pull_request.labels.*.name, 'needs-full-suite')
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        command: --log-error-verbosity=1
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: testing
          MYSQL_INITDB_SKIP_TZINFO: 1
        ports:
          - 3306:3306
        options: --health-cmd="MYSQL_PWD=testing mysqladmin ping -uroot --silent" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v7

      - name: Setup Laravel
        uses: ./.github/actions/setup-laravel

      - name: Configure Laravel for testing
        run: |
          php artisan key:generate
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_DATABASE=testing" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=testing" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "TRANSCRIPTION_SERVICE_TYPE=mock" >> .env

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run full PHPUnit suite
        run: php artisan test --parallel --compact

      - name: Upload Laravel logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-full-tests-logs
          path: storage/logs
          if-no-files-found: ignore

  dedicated-tests:
    name: Dedicated PHPUnit Tests
    needs: changes
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'dedicated')) || contains(github.event.pull_request.labels.*.name, 'needs-dedicated-tests')
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        command: --log-error-verbosity=1
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: testing
          MYSQL_INITDB_SKIP_TZINFO: 1
        ports:
          - 3306:3306
        options: --health-cmd="MYSQL_PWD=testing mysqladmin ping -uroot --silent" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v7

      - name: Setup Laravel
        uses: ./.github/actions/setup-laravel

      - name: Configure Laravel for testing
        run: |
          php artisan key:generate
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_DATABASE=testing" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=testing" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "TRANSCRIPTION_SERVICE_TYPE=mock" >> .env

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run dedicated tests
        run: php artisan test --compact --group=dedicated

      - name: Upload Laravel logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-dedicated-tests-logs
          path: storage/logs
          if-no-files-found: ignore

  dusk:
    name: Browser Tests (Dusk)
    needs: changes
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'dusk')) || needs.changes.outputs.frontend_changed == 'true' || contains(github.event.pull_request.labels.*.name, 'needs-dusk') || contains(github.event.pull_request.labels.*.name, 'needs-browser')
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        command: --log-error-verbosity=1
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: testing
          MYSQL_INITDB_SKIP_TZINFO: 1
        ports:
          - 3306:3306
        options: --health-cmd="MYSQL_PWD=testing mysqladmin ping -uroot --silent" --health-interval=10s --health-timeout=5s --health-retries=3

      selenium:
        image: selenium/standalone-chromium
        ports:
          - 4444:4444
        options: --shm-size=2g --add-host=host-docker-internal:host-gateway

    steps:
      - uses: actions/checkout@v7

      - name: Setup Laravel
        uses: ./.github/actions/setup-laravel

      - name: Configure Laravel for Dusk
        run: |
          php artisan key:generate
          APP_KEY=$(grep ^APP_KEY= .env | cut -d= -f2-)
          sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" .env.dusk.ci

      - name: Run migrations
        run: |
          mysql -h 127.0.0.1 -u root -ptesting -e "CREATE DATABASE IF NOT EXISTS \`testing_dusk\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          DB_HOST=127.0.0.1 DB_DATABASE=testing_dusk DB_USERNAME=root DB_PASSWORD=testing php artisan migrate --force

      - name: Start application server
        run: |
          cp .env.dusk.ci .env
          php artisan serve --host=0.0.0.0 --port=8000 --no-reload >storage/logs/serve.log 2>&1 &

      - name: Wait for Selenium and app server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4444/status | grep -q '"ready"'; then
              echo "Selenium ready"; break
            fi
            echo "Waiting for Selenium ($i/30)..."; sleep 2
          done

          STATUS="000"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/up 2>/dev/null || echo "000")
            echo "App server /up status: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "App server ready"; break
            fi
            echo "Waiting for app server ($i/30)..."
            sleep 2
          done
          [ "$STATUS" = "200" ] || { echo "App server failed to start"; cat storage/logs/serve.log; exit 1; }

      - name: Run Dusk tests
        env:
          APP_ENV: ci
          DUSK_DRIVER_URL: http://localhost:4444/wd/hub
        run: php artisan dusk

      - name: Upload Dusk artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dusk-artifacts
          path: |
            tests/Browser/screenshots
            tests/Browser/console
            storage/logs
          if-no-files-found: ignore

  dependency-audit:
    name: Dependency Audit
    needs: changes
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'dependency-audit')) || contains(github.event.pull_request.labels.*.name, 'needs-dependency-audit')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Laravel
        uses: ./.github/actions/setup-laravel
        with:
          frontend-build: 'false'

      - name: Composer audit
        run: composer audit

      - name: npm audit
        run: npm audit --audit-level=high

  playwright:
    name: Visual Regression (Playwright)
    needs: changes
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'playwright')) || needs.changes.outputs.frontend_changed == 'true' || contains(github.event.pull_request.labels.*.name, 'needs-playwright') || contains(github.event.pull_request.labels.*.name, 'needs-visual') || contains(github.event.pull_request.labels.*.name, 'needs-browser')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy
      options: --user 0

    services:
      mysql:
        image: mysql:8.0
        command: --log-error-verbosity=1
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: testing
          MYSQL_INITDB_SKIP_TZINFO: 1
        ports:
          - 3306:3306
        options: --health-cmd="MYSQL_PWD=testing mysqladmin ping -uroot --silent" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v7

      - name: Install PHP, FFmpeg, MySQL client
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y software-properties-common ca-certificates lsb-release apt-transport-https curl gnupg
          curl -fsSL https://packages.sury.org/php/apt.gpg | gpg --dearmor -o /usr/share/keyrings/sury.gpg
          echo "deb [signed-by=/usr/share/keyrings/sury.gpg] https://packages.sury.org/php/ $(lsb_release -sc) main" > /etc/apt/sources.list.d/sury.list
          apt-get update
          apt-get install -y \
            php8.4-cli php8.4-mysql php8.4-sqlite3 php8.4-curl php8.4-dom php8.4-xml \
            php8.4-mbstring php8.4-zip php8.4-bcmath php8.4-intl php8.4-gd \
            php8.4-soap php8.4-exif php8.4-iconv \
            ffmpeg default-mysql-client unzip
          update-alternatives --set php /usr/bin/php8.4
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Prepare Laravel environment
        shell: bash
        run: |
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          cp .env.example .env
          echo "VIEW_COMPILED_PATH=storage/framework/views" >> .env

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Install and build frontend
        run: npm ci && npm run build

      - name: Configure Laravel for Playwright
        run: |
          php artisan key:generate
          APP_KEY=$(grep ^APP_KEY= .env | cut -d= -f2-)
          cp .env.playwright.ci .env
          sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" .env
          sed -i 's|^DB_HOST=.*|DB_HOST=mysql|' .env

      - name: Run migrations and seed
        run: |
          mysql -h mysql -u root -ptesting -e "CREATE DATABASE IF NOT EXISTS \`testing_pw\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          php artisan migrate --force
          php artisan db:seed --force

      - name: Start application server
        run: |
          php artisan serve --host=0.0.0.0 --port=8000 --no-reload >storage/logs/serve.log 2>&1 &

      - name: Wait for app server
        run: |
          STATUS="000"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/up 2>/dev/null || echo "000")
            echo "App server /up status: $STATUS"
            if [ "$STATUS" = "200" ]; then echo "App server ready"; break; fi
            echo "Waiting for app server ($i/30)..."
            sleep 2
          done
          [ "$STATUS" = "200" ] || { echo "App server failed to start"; cat storage/logs/serve.log; exit 1; }

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
          CI: 'true'
        run: npx playwright test

      - name: Dump app server log
        if: failure()
        run: |
          echo "===== storage/logs/serve.log ====="
          cat storage/logs/serve.log || echo "(no serve.log)"
          echo "===== storage/logs/laravel.log ====="
          tail -n 500 storage/logs/laravel.log 2>/dev/null || echo "(no laravel.log)"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            storage/logs
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse Audits
    needs: changes
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'lighthouse')) || needs.changes.outputs.frontend_changed == 'true' || contains(github.event.pull_request.labels.*.name, 'needs-lighthouse') || contains(github.event.pull_request.labels.*.name, 'needs-browser')
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        command: --log-error-verbosity=1
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: testing
          MYSQL_INITDB_SKIP_TZINFO: 1
        ports:
          - 3306:3306
        options: --health-cmd="MYSQL_PWD=testing mysqladmin ping -uroot --silent" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v7

      - name: Setup Laravel
        uses: ./.github/actions/setup-laravel

      - name: Configure Laravel for Lighthouse
        run: |
          php artisan key:generate
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_DATABASE=testing" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=testing" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "TRANSCRIPTION_SERVICE_TYPE=mock" >> .env
          sed -i 's/^CACHE_DRIVER=.*/CACHE_DRIVER=array/' .env
          sed -i 's/^REDIS_HOST=.*/REDIS_HOST=127.0.0.1/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env

      - name: Run migrations and seed
        run: |
          php artisan migrate --force
          php artisan db:seed --force

      - name: Start application server
        run: php artisan serve --host=127.0.0.1 --port=8000 --no-reload >storage/logs/serve.log 2>&1 &

      - name: Wait for app server
        run: |
          STATUS="000"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/up 2>/dev/null || echo "000")
            echo "Waiting for app server ($i/30)... HTTP $STATUS"; sleep 2
            if [ "$STATUS" = "200" ]; then echo "App server ready"; break; fi
          done
          [ "$STATUS" = "200" ] || { echo "App server failed to start"; cat storage/logs/serve.log; echo "=== Laravel log ==="; cat storage/logs/laravel.log 2>/dev/null || echo "(no laravel.log)"; exit 1; }

      - name: Warm up audited URLs
        run: |
          for url in / /christ /church /community /calendar /christ/sermons; do
            curl -sf "http://127.0.0.1:8000${url}" > /dev/null
          done

      - name: Run Lighthouse CI
        run: npx lhci autorun --collect.numberOfRuns=1

      - name: Upload Lighthouse report artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore

  summary:
    name: Deep Check Summary
    needs: [changes, full-tests, dedicated-tests, dusk, dependency-audit, playwright, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarise deep checks
        run: |
          {
            echo "### Deep Checks"
            echo ""
            echo "- Event: ${{ github.event_name }}"
            echo "- Frontend-impacting changes: ${{ needs.changes.outputs.frontend_changed }}"
            echo "- Full tests: ${{ needs.full-tests.result }}"
            echo "- Dedicated tests: ${{ needs.dedicated-tests.result }}"
            echo "- Dusk: ${{ needs.dusk.result }}"
            echo "- Dependency audit: ${{ needs.dependency-audit.result }}"
            echo "- Playwright: ${{ needs.playwright.result }}"
            echo "- Lighthouse: ${{ needs.lighthouse.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
