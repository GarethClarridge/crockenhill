name: Production Audit

# Read-only, self-service production checks (see docs/issues/README.md O32/O38).
# Runs only the whitelisted audit artisan commands below over the same SSH
# channel the deploy uses. The production-audit environment requires manual
# approval, so a dispatched run waits for a reviewer before it can touch the
# secrets — including runs dispatched from a modified branch copy of this file.
#
# Output lands in the public Actions log, so the audit commands print counts
# only — never storage paths, hash material, or per-user identifiers. Run the
# commands with --details on the server itself to identify affected rows.

on:
  workflow_dispatch:
    inputs:
      audit:
        description: Which audit to run
        type: choice
        default: all
        options:
          - all
          - sermon-assets
          - section-assets
          - password-hashes
          - private-assets
          - service-evidence-coverage
          - source-revision-lineages

permissions:
  contents: read

concurrency:
  group: production-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only production audit
    runs-on: ubuntu-latest
    environment: production-audit

    steps:
      - name: Run audits on production
        uses: appleboy/ssh-action@v1
        env:
          AUDIT: ${{ inputs.audit }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 30m
          envs: AUDIT
          script: |
            set -eu
            cd /srv/crockenhill

            run_artisan() {
              docker compose -f docker-compose.prod.yml --env-file .env.production exec -T app php artisan "$@"
            }

            status=0

            # "private-assets" is the pair of audits that together quantify the
            # private/ prefix: children's-talk sermon assets and section
            # publication candidates. See WP1 of
            # docs/archived-plans/CHILDRENS-TALK-STORAGE-TO-SPACES-2026-07-24.md.
            selected() {
              [ "$AUDIT" = "all" ] || [ "$AUDIT" = "$1" ] || [ "$AUDIT" = "$2" ]
            }

            if selected password-hashes password-hashes; then
              echo "::group::audit:password-hashes"
              run_artisan audit:password-hashes || status=1
              echo "::endgroup::"
            fi

            if selected sermon-assets private-assets; then
              echo "::group::audit:sermon-assets"
              run_artisan audit:sermon-assets || status=1
              echo "::endgroup::"
            fi

            if selected section-assets private-assets; then
              echo "::group::audit:section-assets"
              run_artisan audit:section-assets || status=1
              echo "::endgroup::"
            fi

            # §12.4 of the historic archive readiness remediation plan requires
            # production evidence counts before current-era re-projection can be
            # scheduled: services, services carrying a non-Manual source record,
            # and proposals carrying a resolver. Locally 407 of 408 services have
            # no evidence at all, and local is not a production copy.
            #
            # Reports counts only and always exits 0 — an unevidenced service is
            # the measurement, not a failure, and §12.4 leaves its disposition
            # open. Run with --details on the server to identify rows.
            if selected service-evidence-coverage service-evidence-coverage; then
              echo "::group::audit:service-evidence-coverage"
              run_artisan audit:service-evidence-coverage || status=1
              echo "::endgroup::"
            fi

            # WP1 deploy preflight: the unique-leaf lineage constraint cannot be
            # deployed while any lineage has multiple active leaves. Defaults to
            # defect counts; the repair text names lineage keys (email message
            # ids, archive filenames) and stays behind --details on the server.
            if selected source-revision-lineages source-revision-lineages; then
              echo "::group::service-tracking:audit-source-revision-lineages"
              run_artisan service-tracking:audit-source-revision-lineages || status=1
              echo "::endgroup::"
            fi

            exit "$status"
