name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  master-validation:
    name: Master Validation
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        command: --log-error-verbosity=1
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: testing
          MYSQL_INITDB_SKIP_TZINFO: 1
        ports:
          - 3306:3306
        options: --health-cmd="MYSQL_PWD=testing mysqladmin ping -uroot --silent" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard tracked skill symlinks
        run: ./scripts/check-skill-symlinks.sh

      - name: Guard bootstrap middleware safety
        run: ./scripts/check-bootstrap-safety.sh

      - name: Guard deploy view cache safety
        run: ./scripts/check-deploy-view-cache-safety.sh

      - name: Setup Laravel
        uses: ./.github/actions/setup-laravel

      - name: Configure Laravel for testing
        run: |
          php artisan key:generate
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_DATABASE=testing" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=testing" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "TRANSCRIPTION_SERVICE_TYPE=mock" >> .env

      - name: Run migrations
        run: php artisan migrate --force

      - name: Verify schema dump is current
        run: ./scripts/check-schema-dump-current.sh

      - name: Formatting (Pint)
        run: ./vendor/bin/pint --test

      - name: Typing baseline (changed app files)
        run: ./scripts/check-typing-baseline.sh "${{ github.event.before }}" "${{ github.sha }}"

      - name: PHPStan
        run: composer phpstan

      - name: Tests (Core)
        run: php artisan test --parallel --compact --exclude-group=dedicated --exclude-group=performance

      - name: Tests (Dedicated)
        run: php artisan test --compact --group=dedicated

      - name: Upload Laravel logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-validation-laravel-logs
          path: storage/logs
          if-no-files-found: ignore

      - name: Summarise master validation
        if: always()
        run: |
          {
            echo "### Master Validation"
            echo ""
            echo "- Skill-symlink guard"
            echo "- Bootstrap safety guard"
            echo "- Deploy view-cache safety guard"
            echo "- Frontend build"
            echo "- Schema dump freshness"
            echo "- Pint"
            echo "- Typing baseline"
            echo "- PHPStan"
            echo "- Core PHPUnit suite"
            echo "- Dedicated PHPUnit tests"
          } >> "$GITHUB_STEP_SUMMARY"

  dusk:
    name: Browser Tests (Dusk)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        command: --log-error-verbosity=1
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: testing
          MYSQL_INITDB_SKIP_TZINFO: 1
        ports:
          - 3306:3306
        options: --health-cmd="MYSQL_PWD=testing mysqladmin ping -uroot --silent" --health-interval=10s --health-timeout=5s --health-retries=3

      selenium:
        image: selenium/standalone-chromium
        ports:
          - 4444:4444
        options: --shm-size=2g --add-host=host-docker-internal:host-gateway

    steps:
      - uses: actions/checkout@v7

      - name: Setup Laravel
        uses: ./.github/actions/setup-laravel

      - name: Configure Laravel for Dusk
        run: |
          php artisan key:generate
          APP_KEY=$(grep ^APP_KEY= .env | cut -d= -f2-)
          sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" .env.dusk.ci

      - name: Run migrations
        run: |
          mysql -h 127.0.0.1 -u root -ptesting -e "CREATE DATABASE IF NOT EXISTS \`testing_dusk\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          DB_HOST=127.0.0.1 DB_DATABASE=testing_dusk DB_USERNAME=root DB_PASSWORD=testing php artisan migrate --force

      - name: Start application server
        run: |
          cp .env.dusk.ci .env
          php artisan serve --host=0.0.0.0 --port=8000 --no-reload >storage/logs/serve.log 2>&1 &

      - name: Wait for Selenium and app server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4444/status | grep -q '"ready"'; then
              echo "Selenium ready"; break
            fi
            echo "Waiting for Selenium ($i/30)..."; sleep 2
          done

          STATUS="000"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/up 2>/dev/null || echo "000")
            echo "App server /up status: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "App server ready"; break
            fi
            echo "Waiting for app server ($i/30)..."
            sleep 2
          done
          [ "$STATUS" = "200" ] || { echo "App server failed to start"; cat storage/logs/serve.log; exit 1; }

      - name: Run Dusk tests
        env:
          APP_ENV: ci
          DUSK_DRIVER_URL: http://localhost:4444/wd/hub
        run: php artisan dusk

      - name: Upload Dusk artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dusk-artifacts
          path: |
            tests/Browser/screenshots
            tests/Browser/console
            storage/logs
          if-no-files-found: ignore

  build:
    name: Build & Push
    needs: [master-validation, dusk]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image_digest: ${{ steps.build-image.outputs.digest }}
      image_ref: ${{ steps.image.outputs.ref }}
      image_repo: ${{ steps.image.outputs.repo }}
      image_tag: ${{ steps.image.outputs.tag }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve deterministic image tag
        id: image
        run: |
          set -euo pipefail
          image_repo="${REGISTRY}/${IMAGE_NAME}"
          image_repo="${image_repo,,}"
          echo "repo=${image_repo}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "ref=${image_repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.repo }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        id: build-image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.image.outputs.ref }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Attest image provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.repo }}
          subject-digest: ${{ steps.build-image.outputs.digest }}
          push-to-registry: true

      - name: Summarise image build
        if: always()
        run: |
          {
            echo "### Production Image"
            echo ""
            echo "- Image: ${{ steps.image.outputs.ref }}"
            echo "- Digest: ${{ steps.build-image.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke (Image /up)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test built image
        env:
          IMAGE: ${{ needs.build.outputs.image_ref }}
        run: |
          set -euo pipefail

          APP_KEY="base64:$(openssl rand -base64 32)"

          cleanup() {
            docker rm -f crockenhill-smoke >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          docker pull "$IMAGE"

          docker run -d --name crockenhill-smoke -p 18080:80 \
            -e APP_ENV=production \
            -e APP_DEBUG=false \
            -e APP_KEY="$APP_KEY" \
            -e SESSION_DRIVER=array \
            -e CACHE_STORE=array \
            -e QUEUE_CONNECTION=sync \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=/tmp/smoke.sqlite \
            "$IMAGE"

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/up >/dev/null; then
              echo "Smoke check passed."
              exit 0
            fi

            sleep 2
          done

          echo "Smoke check failed. Container logs:"
          docker logs crockenhill-smoke
          exit 1

      - name: Summarise image smoke
        if: always()
        run: |
          {
            echo "### Image Smoke"
            echo ""
            echo "- Image: ${{ needs.build.outputs.image_ref }}"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    needs: [build, smoke]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      BACKUP_FILE: backups/db-${{ github.run_id }}-${{ github.run_attempt }}.sql.gz

    steps:
      - uses: actions/checkout@v7

      - name: Prepare remote smoke script directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: mkdir -p /srv/crockenhill/scripts

      - name: Upload post-deploy smoke script
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: scripts/post-deploy-smoke.sh
          target: /srv/crockenhill/scripts
          strip_components: 1
          overwrite: true

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        env:
          BACKUP_FILE: ${{ env.BACKUP_FILE }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 240m
          envs: IMAGE_TAG,BACKUP_FILE
          script: |
            set -eu
            cd /srv/crockenhill

            chmod +x ./scripts/post-deploy-smoke.sh

            export IMAGE_TAG
            echo "Deploying app image tag: ${IMAGE_TAG}"

            # Free disk space before pulling. SHA-tagged app images accumulate
            # across deploys; keep running images, but remove unused ones.
            docker system prune -f
            docker image prune -af
            docker builder prune -af

            # Pull new image.
            docker compose -f docker-compose.prod.yml --env-file .env.production pull

            # Start dependencies and wait for health.
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d mysql redis

            echo "Waiting for MySQL to be healthy..."
            MAX_RETRIES=30
            COUNT=0
            until [ $COUNT -ge $MAX_RETRIES ] || docker compose -f docker-compose.prod.yml --env-file .env.production ps mysql --format "{{.Status}}" | grep -q "(healthy)"; do
              echo "MySQL is still starting... ($((COUNT+1))/$MAX_RETRIES)"
              sleep 2
              COUNT=$((COUNT+1))
            done

            if ! docker compose -f docker-compose.prod.yml --env-file .env.production ps mysql --format "{{.Status}}" | grep -q "(healthy)"; then
              echo "MySQL failed to become healthy in time."
              docker compose -f docker-compose.prod.yml --env-file .env.production logs mysql
              exit 1
            fi

            if [ -f .env.production ]; then
              set -a
              . ./.env.production
              set +a
            fi

            : "${DB_DATABASE:?Missing DB_DATABASE in .env.production}"
            : "${DB_USERNAME:?Missing DB_USERNAME in .env.production}"
            : "${DB_PASSWORD:?Missing DB_PASSWORD in .env.production}"

            mkdir -p "$(dirname "$BACKUP_FILE")"
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T -e MYSQL_PWD="${DB_PASSWORD}" mysql \
              mysqldump --no-tablespaces -u"${DB_USERNAME}" "${DB_DATABASE}" \
              | gzip > "$BACKUP_FILE"
            ls -t backups/*.sql.gz | tail -n +6 | xargs -r rm

            docker compose -f docker-compose.prod.yml --env-file .env.production run --rm app \
              php artisan migrate --pretend --force

            docker compose -f docker-compose.prod.yml --env-file .env.production run --rm app \
              php artisan migrate --force

            # Ask the outgoing release's Horizon to finish in-flight jobs and
            # stop consuming before the container swap below kills it. The swap
            # itself picks up the new code (fresh image), so this only narrows
            # the window where a mid-flight job dies and waits out retry_after.
            # `|| true`: tolerate an old image that predates Horizon.
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T app \
              php artisan horizon:terminate || true

            docker compose -f docker-compose.prod.yml --env-file .env.production up -d

            # Flush the application data cache so values written by the previous
            # release cannot be rehydrated by the new code. `optimize` only rebuilds
            # the config/route/event bootstrap caches, not the data cache, so stale
            # Cache::rememberForever() blobs (e.g. public_meeting_view_*) otherwise
            # survive a deploy and 500 once their serialized class shape no longer
            # matches the allow-list. Runs after `up -d` so the new code repopulates.
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T app \
              php artisan cache:clear

            # Skip views to avoid clearing runtime-generated Blade files while
            # live PHP-FPM workers are serving traffic.
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T app \
              php artisan optimize --except=views

            # Register the new release's schedule with schedule-monitor so the
            # /health scheduled-tasks check tracks exactly what is now scheduled
            # (stale tasks are removed, new ones added). Runs after `up -d` so it
            # reads the new code's schedule.
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T app \
              php artisan schedule-monitor:sync

            # Pre-build public/sitemap.xml inside the app container before the
            # canaries run. public/ lives on the container's ephemeral layer (it is
            # not a persisted volume), so a fresh image has no sitemap file. nginx
            # serves public/sitemap.xml statically via try_files, so without this the
            # canary's first /sitemap.xml hit must generate the whole sitemap
            # synchronously within curl's 20s budget and intermittently times out.
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T app \
              php artisan sitemap:generate

            # Canaries must hit the real public edge (Caddy vhost + TLS), so point
            # them at APP_URL — the same origin the continuous checker uses. Sourced
            # from .env.production above. The /up liveness probe stays on localhost.
            : "${APP_URL:?Missing APP_URL in .env.production}"
            CANARY_BASE_URL="${APP_URL}" ./scripts/post-deploy-smoke.sh

            docker image prune -af

      - name: Summarise deployment
        if: always()
        run: |
          {
            echo "### Production Deploy"
            echo ""
            echo "- Commit: ${{ github.sha }}"
            echo "- Image: ${{ needs.build.outputs.image_ref }}"
            echo "- Digest: ${{ needs.build.outputs.image_digest }}"
            echo "- Backup: ${{ env.BACKUP_FILE }}"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
