name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, redis
          coverage: none

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Prepare Laravel environment
        run: |
          mkdir -p storage/framework/{cache,sessions,views} storage/logs bootstrap/cache
          cp .env.example .env
          echo "VIEW_COMPILED_PATH=storage/framework/views" >> .env

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install and build frontend
        run: npm ci && npm run build

      - name: Configure Laravel for testing
        run: |
          php artisan key:generate
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_DATABASE=testing" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "TRANSCRIPTION_SERVICE_TYPE=mock" >> .env

      - name: Run migrations
        run: php artisan migrate --force

      - name: PHPStan
        run: composer phpstan

      - name: Tests
        run: php artisan test --parallel

  build:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /srv/crockenhill

            # Pull new image
            docker compose -f docker-compose.prod.yml --env-file .env.production pull

            # Start dependencies and wait for health
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d mysql redis

            # Wait for MySQL to be healthy
            echo "Waiting for MySQL to be healthy..."
            MAX_RETRIES=30
            COUNT=0
            until [ $COUNT -ge $MAX_RETRIES ] || docker compose -f docker-compose.prod.yml --env-file .env.production ps mysql --format "{{.Status}}" | grep -q "(healthy)"; do
              echo "MySQL is still starting... ($((COUNT+1))/$MAX_RETRIES)"
              sleep 2
              COUNT=$((COUNT+1))
            done

            if ! docker compose -f docker-compose.prod.yml --env-file .env.production ps mysql --format "{{.Status}}" | grep -q "(healthy)"; then
              echo "MySQL failed to become healthy in time."
              docker compose -f docker-compose.prod.yml --env-file .env.production logs mysql
              exit 1
            fi

            # Source environment variables for the backup step
            if [ -f .env.production ]; then
              export $(grep -E '^DB_(DATABASE|USERNAME|PASSWORD)=' .env.production | xargs)
            fi

            # Backup database before migration (keeps last 5 backups)
            BACKUP_FILE="backups/db-$(date +%Y%m%d-%H%M%S).sql"
            mkdir -p backups
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T mysql \
              mysqldump -u"${DB_USERNAME}" -p"${DB_PASSWORD}" "${DB_DATABASE}" > "$BACKUP_FILE"
            ls -t backups/*.sql | tail -n +6 | xargs -r rm

            # Preview migrations (fail early if there's an issue)
            docker compose -f docker-compose.prod.yml --env-file .env.production run --rm app \
              php artisan migrate --pretend --force

            # Run actual migrations
            docker compose -f docker-compose.prod.yml --env-file .env.production run --rm app \
              php artisan migrate --force

            # Restart all services
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d

            # Clear caches and optimize
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T app \
              php artisan optimize

            # Cleanup old images
            docker image prune -f

            # Health check
            sleep 15
            curl -fsS http://localhost/up || exit 1
