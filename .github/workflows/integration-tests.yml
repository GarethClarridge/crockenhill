name: Integration Tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [master]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, redis
        coverage: none
    
    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        ffmpeg -version
    
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Prepare Laravel environment
      run: |
        mkdir -p storage/framework/{cache,sessions,views} storage/logs bootstrap/cache
        cp .env.example .env
        echo "VIEW_COMPILED_PATH=storage/framework/views" >> .env

    - name: Install dependencies
      run: composer install --prefer-dist --no-interaction

    - name: Generate test fixtures
      run: |
        chmod +x tests/Integration/fixtures/generate_fixtures.sh
        cd tests/Integration/fixtures && ./generate_fixtures.sh
    
    - name: Generate application key
      run: php artisan key:generate
    
    - name: Configure environment for integration tests
      run: |
        echo "DB_CONNECTION=mysql" >> .env
        echo "DB_HOST=127.0.0.1" >> .env
        echo "DB_PORT=3306" >> .env
        echo "DB_DATABASE=testing" >> .env
        echo "DB_USERNAME=root" >> .env
        echo "DB_PASSWORD=" >> .env
        echo "QUEUE_CONNECTION=sync" >> .env
        echo "TRANSCRIPTION_SERVICE_TYPE=mock" >> .env
        echo "LIVESTREAM_RMS_THRESHOLD=-30.0" >> .env
        echo "LIVESTREAM_MIN_SECTION_DURATION=30.0" >> .env
        echo "LIVESTREAM_MIN_SERMON_DURATION=60.0" >> .env
    
    - name: Run database migrations
      run: php artisan migrate --force
    
    - name: Run integration tests
      run: php artisan test tests/Integration/