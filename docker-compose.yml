services:
    laravel.test:
        build:
            context: './docker/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.4/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            - '${CBC_SERVICE_VIDEOS_PATH:-./storage/mnt/service-videos}:/mnt/cbc-service-videos:ro'
            - '${CBC_AUDIO_MP3_PATH:-./storage/mnt/audio-mp3}:/mnt/cbc-audio-mp3:ro'
            - '${CBC_SERVICES_PATH:-./storage/mnt/services}:/mnt/cbc-services:ro'
            - './docker/php/php.ini:/etc/php/8.4/cli/conf.d/99-livestream.ini'
            - './docker/php/php.ini:/etc/php/8.4/fpm/conf.d/99-livestream.ini'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
            - selenium
    queue.worker:
        build:
            context: './docker/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.4/app'
        restart: unless-stopped
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            - '${CBC_SERVICE_VIDEOS_PATH:-./storage/mnt/service-videos}:/mnt/cbc-service-videos:ro'
            - './docker/php/php.ini:/etc/php/8.4/cli/conf.d/99-livestream.ini'
        command: >
            php artisan queue:work redis
            --queue=audio-processing,sermon-processing,speaker-identification,default
            --sleep=1
            --tries=3
            --timeout=7200
            --memory=${QUEUE_WORKER_MEMORY:-2048}
        networks:
            - sail
        depends_on:
            - mysql
            - redis
    queue.worker-video:
        build:
            context: './docker/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.4/app'
        restart: unless-stopped
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            - '${CBC_SERVICE_VIDEOS_PATH:-./storage/mnt/service-videos}:/mnt/cbc-service-videos:ro'
            - './docker/php/php.ini:/etc/php/8.4/cli/conf.d/99-livestream.ini'
        command: >
            php artisan queue:work redis
            --queue=video-processing,livestream-processing
            --sleep=1
            --tries=3
            --timeout=7200
            --memory=${QUEUE_WORKER_MEMORY:-2048}
        networks:
            - sail
        depends_on:
            - mysql
            - redis
    # Historic archive workers. Each stage binds on a different resource — ffmpeg
    # on CPU, whisper on the host's single Metal GPU, LLM analysis on a remote API
    # — so each gets its own worker pool whose width is set at calibration. These
    # widths are recorded in the historic processing fingerprint, so the same
    # HISTORIC_MEDIA_WORKERS_* values must be in the environment here and wherever
    # the import command runs. Nothing here touches the weekly queues above.
    queue.worker-historic-ffmpeg: &historic-worker
        build:
            context: './docker/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.4/app'
        restart: unless-stopped
        deploy:
            replicas: ${HISTORIC_MEDIA_WORKERS_FFMPEG:-1}
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            - '${CBC_SERVICE_VIDEOS_PATH:-./storage/mnt/service-videos}:/mnt/cbc-service-videos:ro'
            - './docker/php/php.ini:/etc/php/8.4/cli/conf.d/99-livestream.ini'
        command: >
            php artisan queue:work redis
            --queue=${HISTORIC_MEDIA_QUEUE_FFMPEG:-historic-ffmpeg}
            --sleep=1
            --tries=3
            --timeout=7200
            --memory=${QUEUE_WORKER_MEMORY:-2048}
        networks:
            - sail
        depends_on:
            - mysql
            - redis
    queue.worker-historic-whisper:
        <<: *historic-worker
        deploy:
            replicas: ${HISTORIC_MEDIA_WORKERS_WHISPER:-1}
        command: >
            php artisan queue:work redis
            --queue=${HISTORIC_MEDIA_QUEUE_WHISPER:-historic-whisper}
            --sleep=1
            --tries=3
            --timeout=7200
            --memory=${QUEUE_WORKER_MEMORY:-2048}
    queue.worker-historic-llm:
        <<: *historic-worker
        deploy:
            replicas: ${HISTORIC_MEDIA_WORKERS_LLM:-1}
        command: >
            php artisan queue:work redis
            --queue=${HISTORIC_MEDIA_QUEUE_LLM:-historic-llm}
            --sleep=1
            --tries=3
            --timeout=7200
            --memory=${QUEUE_WORKER_MEMORY:-2048}
    queue.worker-historic-orchestration:
        <<: *historic-worker
        deploy:
            replicas: ${HISTORIC_MEDIA_WORKERS_ORCHESTRATION:-1}
        command: >
            php artisan queue:work redis
            --queue=${HISTORIC_MEDIA_QUEUE_ORCHESTRATION:-historic-orchestration}
            --sleep=1
            --tries=3
            --timeout=7200
            --memory=${QUEUE_WORKER_MEMORY:-2048}
    mysql:
        image: 'mysql:8.0'
        command: >
          --innodb-buffer-pool-size=256M
          --innodb-redo-log-capacity=256M
          --max-connections=120
          --innodb_flush_log_at_trx_commit=2
          --innodb_doublewrite=OFF
          --performance-schema=OFF
          --sync_binlog=0
        mem_limit: 4g
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD-SHELL
                - 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -u root --silent 2>/dev/null || exit 1'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:7-alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 3
    selenium:
        image: 'selenium/standalone-chromium'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - '/dev/shm:/dev/shm'
        networks:
            - sail
    whisper:
        image: fedirz/faster-whisper-server:latest-cpu
        environment:
            WHISPER__MODEL: '${LOCAL_WHISPER_MODEL:-small}'
            WHISPER__INFERENCE_DEVICE: cpu
        ports:
            - '${FORWARD_WHISPER_PORT:-8200}:8000'
        networks:
            - sail
        profiles:
            - whisper
    mailpit:
        image: axllent/mailpit:latest
        ports:
            - "8025:8025"
            - "1025:1025"
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
